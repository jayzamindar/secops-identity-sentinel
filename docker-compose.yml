services:
  secops-identity-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    image: secops-identity-sentinel:latest
    container_name: secops-identity-sentinel
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8080
      - DB_PATH=/app/data/secops_ledger.db
      - AUDIT_LOG_DIR=/app/audit_logs
      - FILELOCK_TIMEOUT_SEC=10.0
      - PLAN_SIGNING_SECRET=sentinel-prod-signing-secret-key-32bytes!
      - SECOPS_IDENTITY_SENTINEL_WEBHOOK_SECRET=sentinel-prod-webhook-secret-key-32bytes!
      - MCP_API_KEY=sentinel-prod-mcp-api-key-32bytes!
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./audit_logs:/app/audit_logs
    mem_limit: 2048m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
