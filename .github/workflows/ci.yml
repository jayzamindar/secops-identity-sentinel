name: Enterprise CI/CD & Supply-Chain Security Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Static Analysis & Linting (Ruff)
        run: |
          python -m ruff check src/ tests/
          python -m ruff format --check src/ tests/

      - name: Strict Static Type Checking (Mypy)
        run: |
          python -m mypy src/

      - name: Test Suite & Coverage Gate (Pytest >= 90%)
        run: |
          python -m pytest -q --tb=short --cov=src/secops_identity_sentinel --cov-fail-under=90

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          python -m pip_audit --desc

      - name: Lockfile Integrity & License Compliance Audit
        run: |
          python -c "
          import sys, importlib.metadata

          PERMISSIVE = {'mit', 'apache', 'apache-2.0', 'apache 2.0', 'bsd', 'bsd-2-clause', 'bsd-3-clause', 'isc', 'psf', 'psf-2.0', 'python software foundation license', 'mpl-2.0', 'mozilla public license 2.0 (mpl 2.0)'}
          COPYLEFT_DISALLOWED = {'gpl', 'agpl', 'gnu general public license', 'affero'}

          violations = []
          for dist in importlib.metadata.distributions():
              name = dist.metadata.get('Name', '')
              raw_lic = (dist.metadata.get('License', '') or dist.metadata.get('License-Expression', '')).lower()
              if any(cl in raw_lic for cl in COPYLEFT_DISALLOWED):
                  violations.append(f'{name}: copyleft license forbidden ({raw_lic})')

          if violations:
              print('License compliance violations detected:\n' + '\n'.join(violations))
              sys.exit(1)
          print('License audit passed: 100% permissive licenses verified.')
          "

      - name: Repository Secret Scanning Check
        run: |
          python -c "
          import sys, re, subprocess

          # 1. Check for tracked .env files
          tracked_files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          for f in tracked_files:
              if f == '.env' or f.endswith('/.env'):
                  print(f'CRITICAL: Tracked .env file detected in repository: {f}')
                  sys.exit(1)

          # 2. Check for hardcoded secrets
          SECRET_PATTERNS = [
              (re.compile(r'sk-[a-zA-Z0-9]{20,}'), 'OpenAI Secret Key pattern'),
              (re.compile(r'AIza[0-9A-Za-z-_]{35}'), 'Google API Key pattern'),
              (re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP |ENCRYPTED )?PRIVATE KEY-----'), 'Private Key Header'),
          ]

          violations = []
          for f in tracked_files:
              # Skip non-source/binary files
              if f.endswith(('.png', '.ico', '.db', '.pyc', '.lock')):
                  continue
              try:
                  with open(f, 'r', encoding='utf-8', errors='ignore') as fh:
                      content = fh.read()
                      for pat, desc in SECRET_PATTERNS:
                          if pat.search(content):
                              violations.append(f'{f}: matches {desc}')
              except Exception:
                  pass

          if violations:
              print('Secret scanning violations detected:\n' + '\n'.join(violations))
              sys.exit(1)
          print('Secret scanning passed: zero tracked secrets found.')
          "
